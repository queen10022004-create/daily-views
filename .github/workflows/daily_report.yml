name: YouTube Views Tracker Daily

on:
  schedule:
    - cron: '0 0 * * *' # Chạy 7h sáng hằng ngày
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_analytics_and_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Python Script
        env:
          API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_tool.py
      - name: 5. Debug & Commit
        run: |
          # --- LỆNH KIỂM TRA MỚI ---
          echo "📂 Đang liệt kê các file trong thư mục hiện tại:"
          ls -R
          # -------------------------

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Thử add file, nếu không có file thì không báo lỗi đỏ lòm nữa mà chỉ báo warning
          git add *.csv || echo "⚠️ Cảnh báo: Không tìm thấy file CSV nào để add!"
          
          # Chỉ commit nếu có sự thay đổi
          git diff --staged --quiet || git commit -m "📊 Auto-update stats [skip ci]"
          git push origin main
      - name: Commit & Push Data back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "📊 Auto-update stats [skip ci]" || echo "No changes to commit"
          git push origin main

      # --- PHẦN MỚI: GỬI EMAIL ---
      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 📊 Báo cáo YouTube Hàng Ngày
          body: |
            Chào bạn,
            
            Đây là báo cáo thống kê lượt xem kênh YouTube của bạn ngày hôm nay.
            File chi tiết được đính kèm bên dưới.
            
            Trân trọng,
            GitHub Bot
          to: ${{ secrets.MAIL_USERNAME }} # Gửi cho chính mình
          from: YouTube Tracker Bot
          attachments: history_*.csv # Tự động tìm file csv để đính kèm
