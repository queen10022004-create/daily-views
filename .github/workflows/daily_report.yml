name: YouTube Views Tracker Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run_analytics_and_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Python Script
        env:
          API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_tool.py

      - name: Commit & Push Data back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "📊 Auto-update Excel stats [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 📊 Báo cáo YouTube Hàng Ngày (@stoicether)
          body: |
            Chào bạn,
            
            Hệ thống đã cập nhật xong số liệu lượt xem ngày hôm nay cho kênh YouTube của bạn.
            File Excel (.xlsx) với 2 Sheet thống kê (Tổng quan & Video tăng view) được đính kèm bên dưới.
            
            Chúc bạn một ngày làm việc hiệu quả!
            GitHub Bot
          to: queen10022004@gmail.com
          from: YouTube Tracker Bot
          # 👇 ĐÃ SỬA LỖI CÚ PHÁP (THÊM DẤU NHÁY ĐƠN) 👇
          attachments: '*.xlsx'
